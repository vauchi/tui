[package]
name = "vauchi-tui-display"
version = "0.2.0"
edition = "2024"
license = "GPL-3.0-or-later"
description = "Terminal display shell for the Vauchi presentation contract"

[dependencies]
vauchi-contract = { git = "https://gitlab.com/vauchi/contract.git", tag = "v0.97.2", version = "=0.97.2" }
ratatui-core = { version = "0.1.2", default-features = false, features = ["std", "layout-cache", "underline-color"] }
ratatui-widgets = { version = "0.3.2", default-features = false, features = ["std"] }
crossterm = "0.28"
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1.0"

[dev-dependencies]
tempfile = "3"
