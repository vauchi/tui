# GitLab CI for vauchi-tui
#
# Terminal user interface
#
# Performance optimizations:
#   - Self-hosted runners: sccache, persistent caches, load-balanced
#   - Change-based rules: Jobs run only when relevant files change
#   - Timeouts: Prevent runaway jobs from blocking runners
#   - Read-only cache for lint jobs
#
# Pipeline strategy:
#   - MR: Validation on relevant file changes
#   - Upstream trigger: Verify compatibility when core merges to main
#
# Uses shared templates from vauchi/scripts for consistency.

# Include shared templates
include:
  - project: 'vauchi/scripts'
    ref: ci-templates-v2026.07.13
    file:
      - '/ci-templates/rust-base.yml'
      - '/ci-templates/allow-direct-guard.yml'
      - '/ci-templates/parser-parity.yml'
      - '/ci-templates/content-fetch.yml'
      - '/ci-templates/security.yml'
      - '/ci-templates/coverage.yml'
      - '/ci-templates/mr-rules.yml'
      - '/ci-templates/downstream.yml'
      - '/ci-templates/reuse.yml'
      - '/ci-templates/release.yml'
      - '/ci-templates/test-quality.yml'
      - '/ci-templates/file-size.yml'
      - '/ci-templates/mutation.yml'
      - '/ci-templates/freshness.yml'
      - '/ci-templates/perf.yml'
      - '/ci-templates/design-drift.yml'
      - '/ci-templates/removed-symbols.yml'
      - '/ci-templates/badges.yml'
      - '/ci-templates/github-mirror.yml'
      - '/ci-templates/vrt-upload.yml'
      - '/ci-templates/verified-fetch.yml'
      - '/ci-templates/tool-install.yml'
      - '/ci-templates/cross-cutting-lint.yml'

variables:
  VAUCHI_SCRIPTS_REF: "ci-templates-v2026.07.13"

stages:
  - auto-tag
  - lint
  - test
  - mutation
  - security
  - verify
  - deploy

# ============================================================
# Auto-Tag Stage (main branch only)
# ============================================================
# When Cargo.toml version is bumped and merged to main,
# automatically create a v{version} tag to trigger the release pipeline.

auto-tag:version:
  extends: .auto-tag
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Lint Stage — Preflight Gate (runs on Rust code changes)
# ============================================================
# Cheapest checks run first. Test + security jobs wait for these
# to pass before starting (PI-13 fail-fast DAG).

lint:format:
  extends: [.rust-runner-nocache, .lint-format, .validation-rust, .timeout-quick]
  needs: []

lint:clippy:
  extends: [.rust-runner-readonly, .lint-clippy, .validation-rust, .timeout-cold-rebuild]
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.clone-themes, before_script]

# Duplicate dependency check (advisory)
lint:duplicates:
  extends: [.rust-runner-nocache, .lint-duplicates-job, .timeout-quick]

# Unused dependency check (advisory)
lint:machete:
  extends: [.rust-runner-nocache, .lint-machete-job, .timeout-quick]

# ============================================================
# Test Stage (runs on Rust code changes, gated by lint)
# ============================================================

# MR: fast nextest (no coverage overhead)
test:unit:
  extends: [.rust-runner, .validation-rust, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run --profile ci --all-targets
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# VRT: render the committed insta .snap snapshots to PNG and upload to Visual
# Regression Tracker. VRT is image-only; a TUI snapshot is a monospace
# character grid, so the render is byte-deterministic for a pinned (Pillow
# version, font bytes, font size) — a baseline only moves when the snapshot
# text changes. Advisory (allow_failure) like every other platform's VRT job.
test:vrt:
  extends: [.rust-runner, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  allow_failure: true
  before_script:
    - !reference [.self-hosted, before_script]
  variables:
    VRT_PLATFORM: tui
    VRT_SCREENSHOT_DIR: tests/vrt/out
  script:
    - |
      # Pinned render deps: Pillow (bundles its own freetype in the wheel, so
      # rasterization is identical across runners) + sha256-pinned DejaVu Sans
      # Mono (full box-drawing + symbol coverage). venv avoids the PEP-668
      # externally-managed-environment lock; fall back to --break-system-packages.
      VENV="/tmp/vrt-venv-${CI_JOB_ID}"
      if python3 -m venv "$VENV" 2>/dev/null; then
        PY="$VENV/bin/python"; "$VENV/bin/pip" install --quiet Pillow==10.4.0
      else
        PY="python3"; python3 -m pip install --quiet --break-system-packages Pillow==10.4.0
      fi
      FONT="/tmp/DejaVuSansMono-${CI_JOB_ID}.ttf"
      curl -fsSL -o "$FONT" \
        "https://github.com/matplotlib/matplotlib/raw/v3.9.2/lib/matplotlib/mpl-data/fonts/ttf/DejaVuSansMono.ttf"
      echo "602ec86b8948cfcd956482fe64f94c36c867770149ef2f791d4613f443bcecb3  $FONT" | sha256sum -c -
      "$PY" tests/vrt/snap-to-png.py --snap-dir . --out-dir "$VRT_SCREENSHOT_DIR" \
        --font "$FONT" --font-size 16
  artifacts:
    when: always
    paths:
      - tests/vrt/out/
    expire_in: 1 week
  after_script:
    - !reference [.vrt-upload-script, script]
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Manual job: record insta snapshot baselines on CI and commit them to the branch.
# CI is the single source of truth for baselines — never record locally.
test:snapshots:record:
  extends: [.rust-runner, .validation-rust, .timeout-cold-rebuild]
  stage: test
  needs:
    - job: lint:format
      optional: true
  when: manual
  allow_failure: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  script:
    - echo "📸 Recording insta snapshot baselines..."
    - |
      # Per-job /tmp paths — shared shell runner persists /tmp across jobs,
      # so fixed names risk EACCES from a foreign-owned leftover file.
      CARGO_LOG="/tmp/cargo-record-${CI_JOB_ID}.log"
      set +e
      INSTA_UPDATE=always cargo test --all-targets 2>&1 | tee "$CARGO_LOG"
      CARGO_EXIT=$?
      set -e
      if [ "$CARGO_EXIT" -ne 0 ]; then
        if grep -q "test result:" "$CARGO_LOG"; then
          echo "✅ Tests executed (exit code ${CARGO_EXIT} from snapshot updates — expected)"
        else
          echo "❌ Build/test infrastructure failure (exit code ${CARGO_EXIT})"
          tail -20 "$CARGO_LOG"
          exit 1
        fi
      else
        echo "✅ All tests passed"
      fi
    # Preserve ALL recorded snapshots across git checkout
    # (covers tests/snapshots/, src/ui/snapshots/, and any future location)
    - find . -name '*.snap' -not -path './target/*' -not -path './.cargo/*' | tar cf "/tmp/insta-all-snapshots-${CI_JOB_ID}.tar" -T -
    # Configure git for push — bypass credential helpers and insteadOf rewrites
    - git config --global --unset-all url."https://gitlab-ci-token:${CI_JOB_TOKEN}@gitlab.com/".insteadOf 2>/dev/null || true
    - git config --global --unset-all credential.helper 2>/dev/null || true
    - git config user.name "vauchi-ci-bot"
    - git config user.email "ci@vauchi.app"
    - PUSH_URL="https://vauchi-gitlab-runner:${PROJECT_ACCESS_TOKEN}@gitlab.com/${CI_PROJECT_PATH}.git"
    - git fetch "$PUSH_URL" "${CI_COMMIT_REF_NAME}"
    - git checkout "${CI_COMMIT_REF_NAME}"
    # Restore ALL recorded snapshots (git checkout resets working directory)
    - tar xf "/tmp/insta-all-snapshots-${CI_JOB_ID}.tar"
    # Commit and push baselines (skip if unchanged)
    - |
      find . -name '*.snap' -not -path './target/*' -not -path './.cargo/*' -exec git add {} +
      if git diff --cached --quiet; then
        echo "✅ No baseline changes — nothing to commit"
        exit 0
      fi
      CHANGED=$(git diff --cached --stat | tail -1)
      git commit -m "chore: record snapshot baselines [ci]

      ${CHANGED}

      Co-Authored-By: vauchi-ci-bot <ci@vauchi.app>"
      git push "$PUSH_URL" HEAD:${CI_COMMIT_REF_NAME}
      echo "✅ Baselines committed and pushed — validation pipeline will trigger"
  rules:
    - !reference [.validation-rust, rules]

# Main: full coverage with llvm-cov (uses shared .coverage-job template)
# TUI needs themes (compile-time include_bytes), cloned in before_script.
# Locales are no longer cloned here: vauchi-app vendors the English
# catalogue, so building it no longer requires the content repo. The TUI
# reads no locale file of its own — every string arrives as Core-prepared
# command copy.
coverage:workspace:
  extends: [.coverage-job, .rust-runner, .timeout-cold-rebuild]
  needs:
    - job: lint:format
      optional: true
    - job: lint:clippy
      optional: true
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - !reference [.clone-themes, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "tui"
    COVERAGE_USE_NEXTEST: "true"

# Binary size tracking (main merges + release tags)
perf:binary-size:
  extends: [.binary-size-tracking-job, .rust-runner, .timeout-cold-rebuild]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  variables:
    BINARY_SIZE_REPO_LABEL: "tui"

# ============================================================
# Mutation Stage (uses shared template from vauchi/scripts)
# ============================================================

mutation:nightly:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "120"

# ============================================================
# Security Stage (runs on dependency changes, gated by lint, parallel with test)
# ============================================================

security:audit:
  extends: [.rust-runner-readonly, .security-audit-job]

security:deny:
  extends: [.rust-runner-readonly, .security-deny-job]

# Supply chain verification (cargo-vet).
#
# Split into two jobs by trigger:
#   security:vet         — MR pipelines: plain `cargo vet --locked` against
#                          the committed Cargo.lock. Matches the documented
#                          principle in security.yml:152 ("never regenerate,
#                          as newer versions may lack exemptions"). MRs that
#                          legitimately bump Cargo.lock must also commit the
#                          matching exemption updates (run `cargo vet
#                          regenerate exemptions` locally).
#   security:vet-autofix — main + schedule only: regenerates the lockfile
#                          (drops path overrides), syncs exemptions from
#                          vauchi-core via cross-project CI_JOB_TOKEN, and on
#                          remaining unvetted deps opens an auto-merge MR
#                          (with the predecessor-cleanup behavior added in
#                          scripts!374).
#
# Pre-2026-05-28 a single `security:vet` extended `.security-vet-autofix-job`
# for all triggers, so every MR ran the regen step — racing against upstream
# transitive dep churn (every `compact_str 0.8.1 → 0.8.2` registry push broke
# MRs that touched Cargo.lock). The split below restores the documented
# committed-lockfile invariant for MR gating.
security:vet:
  extends: [.rust-runner-readonly, .security-vet-job]

security:vet-autofix:
  extends: [.rust-runner-readonly, .security-vet-autofix-job]
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_PIPELINE_SOURCE == "schedule"
  script:
    - |
      curl --silent --fail \
        "${CI_API_V4_URL}/projects/77957857/repository/files/scripts%2Fci%2Fvet-autofix.sh/raw?ref=${VAUCHI_SCRIPTS_REF}" \
        -o vet-autofix.sh
      chmod +x vet-autofix.sh
    - ./vet-autofix.sh --sync-from=77874344

# ============================================================
# Advisory: Cargo.lock Freshness Check
# ============================================================
# Warns when vauchi-core dependency is behind main. Never blocks.

check:core-freshness:
  extends: .check-core-freshness

# Blocks MRs with non-main branch refs in Cargo.toml git dependencies.
check:branch-refs:
  extends: .check-git-branch-refs

# Presentation drift: verify every canonical presentation node is rendered.
check:design-drift:
  extends: .design-drift-job
  variables:
    DESIGN_DRIFT_MATCH_MODE: "grep"
    DESIGN_DRIFT_GREP_FILE: "src/ui/presentation_renderer"
    DESIGN_DRIFT_PROTOCOL: "presentation"
    CORE_REF: "main"
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/$CI_DEFAULT_BRANCH
        paths:
          - "src/ui/widgets/screen_renderer/mod.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      changes:
        paths:
          - "src/ui/widgets/screen_renderer/mod.rs"
          - ".gitlab-ci.yml"

# Removed symbols: detect stale references to removed features
check:removed-symbols:
  extends: .removed-symbols-job


# Humble-UI ratchet: block new domain logic / domain vocabulary leaks
# into the view layer (ADR-043 Amendment 6). Snapshot counts are
# tracked in vauchi/scripts; the ratchet may only drop.
lint:humble:
  extends: .cross-cutting-lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        compare_to: refs/heads/main
        paths:
          - "src/**/*.rs"
          - ".gitlab-ci.yml"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# ============================================================
# Dev Tag Pipeline (lightweight — lint + test only)
# ============================================================
# Triggered by v0.2.3-dev.N tags. Fast feedback, no coverage/mutation/publish.

dev:verify:
  extends: [.rust-runner-nocache, .dev-verify]
  stage: lint
  needs: []

dev:lint:format:
  extends: [.rust-runner-nocache, .dev-lint-format]

dev:lint:clippy:
  extends: [.rust-runner-readonly, .dev-lint-clippy]

dev:test:
  extends: [.rust-runner, .timeout-standard]
  stage: test
  needs: [dev:lint:format]
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
  script:
    - cargo nextest run --profile ci --all-targets
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-dev\.\d+$/
  artifacts:
    when: always
    reports:
      junit: target/nextest/ci/junit.xml
    expire_in: 1 week

# ============================================================
# RC Tag Pipeline (full quality gate — no publish/deploy)
# ============================================================
# Triggered by v0.2.3-rc.N tags. Full coverage + mutation.

rc:verify:
  extends: [.rust-runner-nocache, .rc-verify]
  stage: lint
  needs: []

rc:lint:format:
  extends: [.rust-runner-nocache, .rc-lint-format]

rc:lint:clippy:
  extends: [.rust-runner-readonly, .rc-lint-clippy]

rc:test:
  extends: [.coverage-job, .rust-runner, .timeout-long]
  needs:
    - job: rc:lint:format
      optional: true
    - job: rc:lint:clippy
      optional: true
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - rustup component add llvm-tools-preview 2>/dev/null || true
  variables:
    COVERAGE_REPO_LABEL: "tui"

rc:mutation:
  extends: [.mutation-nightly, .rust-runner, .timeout-extended]
  rules:
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+-rc\.\d+$/
  variables:
    MUTATION_TIMEOUT_NIGHTLY: "120"

rc:security:audit:
  extends: [.rust-runner-readonly, .rc-security-audit]

# ============================================================
# Verify Stage (upstream trigger only)
# ============================================================
# Runs when core merges to main and triggers this repo via
# verify:downstream-rust. Verifies this repo builds and tests
# pass against the updated vauchi-core.

verify:upstream-compat:
  extends: [.rust-runner, .verify-on-upstream, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run --profile ci --all-targets

# Runs when core creates a dev/RC tag and triggers this repo.
# Verifies this repo builds and tests pass against the core tag.
verify:upstream-prerelease:
  extends: [.rust-runner, .verify-on-upstream-prerelease, .verify-nextest-artifacts, .timeout-standard]
  stage: verify
  needs: []
  before_script:
    - !reference [.self-hosted, before_script]
    - !reference [.git-credentials, before_script]
    - !reference [.clone-themes, before_script]
  script:
    - cargo nextest run --profile ci --all-targets

# ============================================================
# Deploy Stage — Badge Pages
# ============================================================

pages:
  extends: .badges-pages
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      when: never
    - if: $CI_PIPELINE_SOURCE == "pipeline" || $CI_PIPELINE_SOURCE == "trigger" || $CI_PIPELINE_SOURCE == "api"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: always

github-mirror:
  extends: .github-mirror
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
    - if: $CI_COMMIT_TAG =~ /^v\d+\.\d+\.\d+/

check:schedule-safety:
  stage: lint
  image: ${CI_DEPENDENCY_PROXY_GROUP_IMAGE_PREFIX}/alpine:3.21
  tags: [docker]
  needs: []
  script:
    - ci/tests/schedule-safety-contract.test.sh
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Parser-parity gate for Core's canonical PresentationNode enum.
check:parser-parity:
  extends: .parser-parity-job
  variables:
    FRONTEND_NAME: "tui"
    PARSER_FILE: "src/ui/presentation_renderer"
    PARSER_PROTOCOL: "presentation"
    PARSER_SCRIPT_REF: "ci-templates-v2026.07.13"
    CORE_REF: "main"
