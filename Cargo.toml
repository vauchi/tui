[package]
name = "vauchi-tui"
version = "0.2.0"
edition = "2024"
description = "Terminal UI for Vauchi - privacy-focused contact card exchange"
license = "GPL-3.0-or-later"

[features]
default = []
secure-storage = ["vauchi-core/secure-storage"]

[dependencies]
# Core library - use git dependency for CI, patched to local path via .cargo/config.toml
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", branch = "main", features = ["network"] }
vauchi-app = { git = "https://gitlab.com/vauchi/core.git", branch = "main", features = ["network"] }

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# CLI argument parsing
clap = { version = "4", features = ["derive"] }

# Error handling
anyhow = "1.0"

# Instance locking (flock)
[target.'cfg(unix)'.dependencies]
libc = "0.2"

# Directories for config
dirs = "5.0"

# QR code rendering
qrcode = "0.14"

# Hex encoding
hex = "0.4"

# Open URLs in system browser/app
open = "5"

# Clipboard support (copy field values)
arboard = "3"

# Serialization for protocol messages
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
insta = "1.41"
regex = "1"

# Release profile: smaller + safer binaries (matches core)
[profile.release]
lto = true
strip = true
panic = "abort"
overflow-checks = true

# Development profile: fast builds, backtraces work (matches core)
[profile.dev]
debug = "line-tables-only"
split-debuginfo = "unpacked"

# Test profile: skip full debug info, reduce binary size ~60%
[profile.test]
debug = "line-tables-only"
split-debuginfo = "off"
