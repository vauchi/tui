[package]
name = "vauchi-tui"
version = "0.2.0"
edition = "2021"
description = "Terminal UI for Vauchi - privacy-focused contact card exchange"
license = "GPL-3.0-or-later"

[features]
default = []
secure-storage = ["vauchi-core/secure-storage"]

[dependencies]
# Core library - use git dependency for CI, patched to local path via .cargo/config.toml
vauchi-core = { git = "https://gitlab.com/vauchi/core.git", branch = "main" }

# Terminal UI
ratatui = "0.28"
crossterm = "0.28"

# Async runtime
tokio = { version = "1", features = ["full"] }

# Error handling
anyhow = "1.0"

# Directories for config
dirs = "5.0"

# QR code rendering
qrcode = "0.14"

# Hex encoding
hex = "0.4"

# Open URLs in system browser/app
open = "5"

# Clipboard support (copy field values)
arboard = "3"

# Async WebSocket for relay sync
tokio-tungstenite = { version = "0.24", features = ["native-tls"] }
# Stream/Sink combinators for async WebSocket
futures-util = "0.3"

# Serialization for protocol messages
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3"
insta = "1.41"
regex = "1"
